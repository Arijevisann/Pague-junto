<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="responsive.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você foi convidado! - Pague Junto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Nunito', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0A1628; color: #fff;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 32px 20px;
        }
        .container {
            width: 100%; max-width: 420px;
            display: flex; flex-direction: column; align-items: center;
            animation: fadeUp 0.4s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .icon-wrap {
            width: 80px; height: 80px;
            background: rgba(37,99,235,0.15); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #3B82F6; margin-bottom: 20px;
        }
        h1 { font-size: 26px; font-weight: 900; text-align: center; margin-bottom: 6px; }
        .sub { font-size: 15px; color: rgba(255,255,255,0.4); font-weight: 600; text-align: center; margin-bottom: 28px; }

        .card {
            width: 100%; background: #131F35;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px; padding: 28px 24px;
            margin-bottom: 24px; text-align: center;
        }
        .rateio-nome { font-size: 22px; font-weight: 900; color: #3B82F6; margin-bottom: 6px; }
        .criador-email { font-size: 13px; color: rgba(255,255,255,0.35); font-weight: 600; margin-bottom: 24px; }
        .valor-label { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .valor { font-size: 48px; font-weight: 900; color: #fff; margin-bottom: 20px; line-height: 1; }
        .valor span { font-size: 28px; font-weight: 700; opacity: 0.7; }
        .pix-badge {
            background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.2);
            border-radius: 12px; padding: 12px 16px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 14px; font-weight: 800; color: #3B82F6;
        }

        /* Botões */
        .btn-pagar {
            width: 100%; background: #2563EB; color: #fff;
            font-size: 18px; font-weight: 900;
            font-family: 'Nunito', sans-serif;
            padding: 20px; border-radius: 16px; border: none;
            cursor: pointer; margin-bottom: 12px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 24px rgba(37,99,235,0.35);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-pagar:hover { background: #1d4ed8; }
        .btn-pagar:active { transform: scale(0.98); }

        .btn-login {
            width: 100%; background: transparent; color: #3B82F6;
            font-size: 16px; font-weight: 800;
            font-family: 'Nunito', sans-serif;
            padding: 18px; border-radius: 16px;
            border: 2px solid rgba(59,130,246,0.4);
            cursor: pointer; margin-bottom: 16px;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-login:hover { background: rgba(59,130,246,0.08); border-color: #3B82F6; }

        .aviso { font-size: 13px; color: rgba(255,255,255,0.3); font-weight: 600; text-align: center; }

        .divider {
            display: flex; align-items: center; gap: 12px;
            width: 100%; margin-bottom: 16px;
            color: rgba(255,255,255,0.2); font-size: 12px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
    </style>
</head>
<body>
<div class="container" id="conteudo">
    <div style="text-align:center; color:rgba(255,255,255,0.3); font-size:15px; font-weight:700;">
        <i class="fas fa-spinner fa-spin" style="font-size:32px; margin-bottom:16px; display:block; color:#2563EB;"></i>
        Carregando convite...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import firebaseConfig from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const rateioId = urlParams.get('id');
    const container = document.getElementById('conteudo');

    async function carregarConvite() {
        if (!rateioId) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;">
                <i class="fas fa-link-slash" style="font-size:48px;color:#F87171;margin-bottom:16px;display:block;"></i>
                <p style="color:rgba(255,255,255,0.4);font-size:16px;font-weight:700;">Convite inválido ou expirado.</p>
            </div>`;
            return;
        }

        try {
            const snap = await getDoc(doc(db, "rateios", rateioId));
            if (!snap.exists()) {
                container.innerHTML = `<div style="text-align:center;padding:40px 0;">
                    <i class="fas fa-triangle-exclamation" style="font-size:48px;color:#F87171;margin-bottom:16px;display:block;"></i>
                    <p style="color:rgba(255,255,255,0.4);font-size:16px;font-weight:700;">Este rateio não existe mais.</p>
                </div>`;
                return;
            }

            const data = snap.data();
            const valor = Number(data.valorIndividual).toFixed(2);
            const [reais, centavos] = valor.split('.');

            container.innerHTML = `
                <div class="icon-wrap">
                    <i class="fas fa-envelope-open-text"></i>
                </div>
                <h1>Você foi convidado!</h1>
                <p class="sub">Para participar do rateio:</p>

                <div class="card">
                    <div class="rateio-nome">${data.nome}</div>
                    <div class="criador-email">Criado por ${data.criadorEmail || 'administrador'}</div>
                    <div class="valor-label">Sua parte é:</div>
                    <div class="valor">R$ ${reais}<span>,${centavos}</span></div>
                    <div class="pix-badge">
                        <i class="fas fa-info-circle"></i>
                        Pagamento via Pix
                    </div>
                </div>

                <button class="btn-pagar" onclick="criarConta()">
                    <i class="fas fa-user-plus"></i> Criar conta e pagar
                </button>

                <div class="divider">já tenho conta</div>

                <button class="btn-login" onclick="fazerLogin()">
                    Entrar e pagar
                </button>

                <p class="aviso">Ao pagar, o criador será notificado instantaneamente.</p>
            `;

        } catch (e) {
            container.innerHTML = `<div style="text-align:center;padding:40px 0;">
                <i class="fas fa-circle-exclamation" style="font-size:48px;color:#F87171;margin-bottom:16px;display:block;"></i>
                <p style="color:rgba(255,255,255,0.4);font-size:16px;font-weight:700;">Erro ao carregar. Tente novamente.</p>
            </div>`;
        }
    }

    // Se já estiver logado, vai direto para pagamento
    onAuthStateChanged(auth, (user) => {
        if (user && rateioId) {
            window.location.href = `pagamento.html?id=${rateioId}`;
        }
    });

    // Salva o rateioId para redirecionar após cadastro/login
    window.criarConta = () => {
        localStorage.setItem('rateioConvite', rateioId);
        window.location.href = `cadastro.html?convite=${rateioId}`;
    };

    window.fazerLogin = () => {
        localStorage.setItem('rateioConvite', rateioId);
        window.location.href = `login.html?convite=${rateioId}`;
    };

    carregarConvite();
</script>
</body>
</html>
